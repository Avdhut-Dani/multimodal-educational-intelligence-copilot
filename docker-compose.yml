services:
  api:
    build: .
    container_name: ingestion-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - CELERY_ALWAYS_EAGER=false
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
      - qdrant

  worker:
    build: .
    container_name: ingestion-worker
    restart: always
    command: celery -A app.celery_app.celery_app worker --concurrency=10 --loglevel=info
    environment:
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - CELERY_ALWAYS_EAGER=false
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
      - qdrant

  redis:
    image: redis:7-alpine
    container_name: ingestion-redis
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ingestion-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
